<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>棋局教练 · AI 国际象棋</title>
  <style>
    :root{--ink:#18241e;--paper:#f6f2e9;--card:#fffdf8;--sage:#4f765c;--gold:#e8ba64;--red:#bd5548;--line:#ddd5c5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,"Microsoft YaHei",sans-serif}.shell{max-width:1180px;margin:auto;padding:28px 20px 50px}header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}h1{margin:0;font-size:30px;letter-spacing:-1px}header p{margin:4px 0 0;color:#69756c}.tag{background:#e0ebdf;color:#315a40;padding:7px 10px;border-radius:99px;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:minmax(320px,620px) minmax(280px,1fr);gap:25px}.board-wrap,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 24px #352b1910}.board-wrap{padding:14px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid #7d6040}.sq{position:relative;display:grid;place-items:center;border:0;font-size:clamp(28px,5.4vw,52px);cursor:pointer;line-height:1;background:#f0d9b5}.sq.dark{background:#b58863}.sq.selected{box-shadow:inset 0 0 0 4px #f9d567}.sq.choice:after{content:"";position:absolute;width:19%;aspect-ratio:1;border-radius:50%;background:#315a40aa}.sq.capture:after{content:"";position:absolute;inset:7%;border-radius:50%;border:4px solid #bd5548cc}.piece{z-index:1;filter:drop-shadow(0 1px 0 #fff8)}.status{padding:15px 6px 3px;font-weight:650}.panel{padding:20px}.new-game{display:grid;gap:12px}.label{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:#687369}select,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid var(--line);background:#fff;color:var(--ink)}button{cursor:pointer;background:var(--sage);border-color:var(--sage);color:white;font-weight:700}button:hover{filter:brightness(.94)}button:disabled{opacity:.55;cursor:not-allowed}.moves{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;min-height:170px;max-height:260px;overflow:auto}.moves h2,.review h2{font-size:14px;margin:0 0 9px}.move-list{display:grid;grid-template-columns:38px 1fr 1fr;gap:3px;color:#465248;font-family:ui-monospace,monospace}.review{grid-column:1/-1;margin-top:10px;padding:23px;display:none}.review.show{display:block}.summary{padding:13px 15px;background:#edf4eb;border-radius:10px;margin-bottom:14px}.issue{border-left:4px solid var(--gold);background:#fff9ee;padding:11px 13px;margin:9px 0;border-radius:0 8px 8px 0}.issue.bad{border-color:var(--red);background:#fff3f1}.issue strong{display:block}.hint{color:#69756c;font-size:13px;margin:0}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ffffff70;border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}@media(max-width:780px){header{align-items:flex-start;flex-direction:column;gap:12px}.layout{grid-template-columns:1fr}.review{grid-column:auto}}
    /* 棋盘格不继承通用按钮内边距，始终以棋盘宽度均分成 8×8 正方形。 */
    .board { grid-template-rows:repeat(8,1fr); }
    .board .sq { aspect-ratio:1 / 1; width:100%; height:100%; min-width:0; min-height:0; padding:0; border:0; border-radius:0; color:#202522; }
    /* 空心棋子为白方，实心棋子为黑方；避免被按钮的白色文字样式覆盖。 */
    .board .piece { font-family:"Segoe UI Symbol","Arial Unicode MS",serif; }
    /* 立体棋子与移动过渡 */
    .board .piece.white { color:#fffdf5; text-shadow:0 1px 0 #fff,0 2px 0 #d5c8b2,0 4px 5px #4a321c66; filter:none; }
    .board .piece.black { color:#202522; text-shadow:0 1px 0 #59645b,0 3px 4px #34231588; filter:none; }
    .board .piece { transform:perspective(180px) rotateX(7deg); transition:transform .16s ease; will-change:transform; }
    .board .sq:hover .piece { transform:perspective(180px) rotateX(7deg) translateY(-2px); }
    .review-grid{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:22px;align-items:start}.review-board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;border:1px solid #7d6040;border-radius:9px;overflow:hidden}.review-board .sq{font-size:clamp(19px,3.2vw,34px)}.review-board .piece.white{color:#fffdf5;text-shadow:0 1px 0 #fff,0 2px 0 #d5c8b2,0 3px 4px #4a321c66}.review-board .piece.black{color:#202522;text-shadow:0 1px 0 #59645b,0 2px 3px #34231588}.replay-controls{display:flex;gap:8px;margin-top:10px}.replay-controls button{padding:7px 10px;font-size:13px}.route{margin-top:15px;padding:14px;border-radius:10px;background:#edf4eb}.route button{margin-top:7px}.route-line{margin:10px 0 0;padding-left:18px}.route-line li{margin:6px 0}.review-step{font-weight:700;margin:0 0 8px}.capture-fx{position:absolute;z-index:3;pointer-events:none;font-size:28px;color:#ffe29b;text-shadow:0 1px 4px #6d2e1b}.capture-fx.knight{animation:kick .36s ease-out}.capture-fx.bishop{animation:slash .34s ease-out}.capture-fx.rook{animation:crash .34s ease-out}.capture-fx.queen{animation:flash .4s ease-out}.capture-fx.pawn,.capture-fx.king{animation:jab .32s ease-out}@keyframes kick{0%{transform:translate(-19px,10px) rotate(-30deg);opacity:0}35%{opacity:1}100%{transform:translate(18px,-15px) rotate(25deg);opacity:0}}@keyframes slash{0%{transform:scale(.3) rotate(-45deg);opacity:0}35%{opacity:1}100%{transform:scale(1.5) rotate(45deg);opacity:0}}@keyframes crash{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.4);opacity:1}100%{transform:scale(1.8);opacity:0}}@keyframes flash{0%,100%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.4)}}@keyframes jab{0%{transform:translateY(12px);opacity:0}35%{opacity:1}100%{transform:translateY(-13px);opacity:0}}@media(max-width:620px){.review-grid{grid-template-columns:1fr}.review-board{max-width:360px}}
  </style>
</head>
<body><main class="shell"><header><div><h1>棋局教练</h1><p>和不同强度的 AI 对弈，终局后获得一份真正可读的复盘。</p></div><span class="tag">本地 AI · 无需账号</span></header>
<section class="layout"><div class="board-wrap"><div id="board" class="board" aria-label="国际象棋棋盘"></div><div id="status" class="status">请选择难度后开始。</div></div>
<aside class="panel"><div class="new-game"><label class="label" for="difficulty">AI 难度</label><select id="difficulty"><option value="1">入门 · 会吃子，偶尔失误</option><option value="2" selected>进阶 · 会规划兑换</option><option value="3">挑战 · 搜索更深的变化</option></select><label class="label" for="side">执棋方</label><select id="side"><option value="w" selected>我执白</option><option value="b">我执黑</option></select><button id="start">开始新棋局</button></div><div class="moves"><h2>着法记录</h2><div id="moveList" class="move-list"><span class="hint">棋局尚未开始</span></div></div></aside>
<section id="review" class="panel review"><h2>全局复盘</h2><div id="reviewContent"></div></section></section></main>
<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';
const U={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}, W={p:'♙',n:'♘',b:'♗',r:'♖',q:'♕',k:'♔'};
const board=document.querySelector('#board'),status=document.querySelector('#status'),list=document.querySelector('#moveList'),review=document.querySelector('#review'),content=document.querySelector('#reviewContent');
let game, human='w', chosen=null, log=[], busy=false;
const val={p:100,n:320,b:330,r:500,q:900,k:20000};
function score(c){let s=0; for(const row of c.board())for(const x of row)if(x)s+=(x.color==='w'?1:-1)*val[x.type]; const mobility=c.moves().length*3*(c.turn()==='w'?1:-1);return s+mobility}
function negamax(c,d,a=-999999,b=999999){if(c.isCheckmate())return -25000-d;if(c.isDraw())return 0;if(!d)return (c.turn()==='w'?1:-1)*score(c);let best=-999999;for(const m of order(c.moves({verbose:true}))){c.move(m);const v=-negamax(c,d-1,-b,-a);c.undo();if(v>best)best=v;if(v>a)a=v;if(a>=b)break}return best}
function order(ms){return ms.sort((a,b)=>((b.captured?10:0)+(b.promotion?8:0))-((a.captured?10:0)+(a.promotion?8:0)))}
function best(c,d){let choice,high=-999999;for(const m of order(c.moves({verbose:true}))){c.move(m);const v=-negamax(c,d-1);c.undo();if(v>high){high=v;choice=m}}return {move:choice,value:high}}
function render(motion){board.innerHTML='';if(!game)return;const rows=game.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){const sq='abcdefgh'[f]+(8-r),p=rows[r][f],el=document.createElement('button');el.className='sq '+((r+f)%2?'dark':'');el.dataset.sq=sq;if(chosen===sq)el.classList.add('selected');if(chosen){const moves=game.moves({square:chosen,verbose:true});const hit=moves.find(m=>m.to===sq);if(hit)el.classList.add(hit.captured?'capture':'choice')}if(p)el.innerHTML='<span class="piece '+(p.color==='w'?'white':'black')+'">'+(p.color==='w'?W[p.type]:U[p.type])+'</span>';el.onclick=()=>click(sq);board.append(el)}renderMoves();if(motion){const target=board.querySelector('[data-sq="'+motion.to+'"] .piece'),sq=board.querySelector('[data-sq="'+motion.to+'"]');if(target){const now=target.getBoundingClientRect(),dx=motion.left-now.left,dy=motion.top-now.top;target.animate([{transform:`perspective(180px) rotateX(7deg) translate(${dx}px,${dy}px) scale(.92)`},{transform:'perspective(180px) rotateX(7deg) translate(0,0) scale(1)'}],{duration:210,easing:'cubic-bezier(.18,.75,.25,1)'});if(motion.capture){setTimeout(()=>{const fx=document.createElement('span');fx.className='capture-fx '+motion.piece;fx.textContent=motion.piece==='knight'?'✦':motion.piece==='bishop'?'／':motion.piece==='rook'?'✹':motion.piece==='queen'?'✧':'✦';sq.append(fx);fx.addEventListener('animationend',()=>fx.remove())},150)}}}}
function renderMoves(){if(!log.length){list.innerHTML='<span class="hint">棋局尚未开始</span>';return}let html='';for(let i=0;i<log.length;i+=2)html+=`<span>${i/2+1}.</span><span>${log[i]?.san||''}</span><span>${log[i+1]?.san||''}</span>`;list.innerHTML=html}
function motionFrom(from,to,piece,capture){const p=board.querySelector('[data-sq="'+from+'"] .piece');const r=p?.getBoundingClientRect();return r?{left:r.left,top:r.top,to,piece,capture}:null}
function click(sq){if(!game){status.textContent='请先点击“开始新棋局”。';return}if(busy){status.textContent='AI 正在思考，请稍候。';return}if(game.turn()!==human){status.textContent='现在轮到 AI 走棋。';return}if(chosen===sq){chosen=null;render();return}const p=game.get(sq);if(!chosen){if(p?.color===human){chosen=sq;render();status.textContent='已选择 '+sq+'：绿色圆点是可走位置，红圈是可吃子。'}else status.textContent='请选择你自己的棋子。';return}const legal=game.moves({square:chosen,verbose:true}).find(m=>m.to===sq);if(!legal){chosen=p?.color===human?sq:null;render();status.textContent=chosen?'已切换棋子。':'该走法不合法：棋子不能越过其他棋子，也不能让自己的王被将军。';return}const before=game.fen(), motion=motionFrom(chosen,sq,legal.piece,Boolean(legal.captured));const moved=game.move({from:chosen,to:sq,promotion:'q'});log.push({...moved,before,side:human});chosen=null;afterMove(motion)}
function afterMove(motion){render(motion);if(finish())return;busy=true;status.innerHTML='<span class="spinner"></span> AI 正在思考…';setTimeout(()=>{requestAnimationFrame(()=>{try{const level=Number(document.querySelector('#difficulty').value),d=level===1?1:2;const choice=best(game,d);if(!choice.move)throw new Error('没有可走着法');const before=game.fen(), motion=motionFrom(choice.move.from,choice.move.to,choice.move.piece,Boolean(choice.move.captured));const moved=game.move(choice.move);log.push({...moved,before,side:game.turn()==='w'?'b':'w'});render(motion);finish()||setStatus()}catch(err){status.textContent='AI 走棋出现问题，请重新开始本局。'}finally{busy=false}})},70)}
function finish(){if(game.isGameOver()){status.textContent=game.isCheckmate()?(game.turn()===human?'你被将杀了。':'将杀！你赢了。'):'棋局结束：和棋。';makeReview();return true}return false}
function setStatus(){status.textContent=game.turn()===human?'轮到你走棋。':'轮到 AI。'}
let replayFens=[],replayAt=0,replayIssues=[];
function drawReplay(){const target=document.querySelector('#replayBoard'),label=document.querySelector('#replayLabel');if(!target)return;const c=new Chess(replayFens[replayAt]),rows=c.board();target.innerHTML='';for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=rows[r][f],el=document.createElement('div');el.className='sq '+((r+f)%2?'dark':'');if(p)el.innerHTML='<span class="piece '+(p.color==='w'?'white':'black')+'">'+(p.color==='w'?W[p.type]:U[p.type])+'</span>';target.append(el)}label.textContent=replayAt===0?'开局位置':`第 ${Math.ceil(replayAt/2)} 回合 · ${log[replayAt-1].san}`;document.querySelector('#prevReplay').disabled=replayAt===0;document.querySelector('#nextReplay').disabled=replayAt===log.length}
function showBestRoute(){const box=document.querySelector('#routeResult');if(!box)return;const issue=replayIssues[0],c=new Chess(issue.before),line=[];for(let ply=0;ply<4&&!c.isGameOver();ply++){const pick=best(c,2);if(!pick.move)break;const who=c.turn()==='w'?'白方':'黑方';line.push({who,san:pick.move.san,reason:pick.move.captured?'先赢得子力并打开局面':pick.move.san.includes('+')||pick.move.san.includes('#')?'制造直接的王翼威胁':'改善子力位置，并保留更多应对选择'});c.move(pick.move)}box.innerHTML='<p><b>从「'+issue.move+'」之前开始的推荐变化：</b></p><ol class="route-line">'+line.map(x=>'<li><b>'+x.who+'：'+x.san+'</b> — '+x.reason+'</li>').join('')+'</ol><p class="hint">这条路线来自当前本地引擎的短变化搜索；重点是先处理威胁，再发展或兑换。</p>'}
function makeReview(){const humanMoves=log.filter(x=>x.side===human);let issues=[];for(const x of humanMoves){const after=new Chess(x.before);after.move(x);const actual=-negamax(after,2),loss=x.bestValue-actual;if(x.san!==x.bestSan&&(loss>45||issues.length<2)){issues.push({level:loss>150?'严重失误':loss>70?'可改进的一步':'有更好的选择',loss,move:x.san,best:x.bestSan,before:x.before})}}replayIssues=issues.sort((a,b)=>b.loss-a.loss).slice(0,6);const c=new Chess();replayFens=[c.fen()];for(const x of log){c.move(x);replayFens.push(c.fen())}replayAt=0;const routePrompt=replayIssues.length>=2?'<div class="route"><b>你多次错过了当前局面的最佳着。</b><br><button id="showRoute">要不要展示最优路线？</button><div id="routeResult"></div></div>':'';content.innerHTML='<div class="summary">你走了 <b>'+humanMoves.length+'</b> 手。使用左右按钮可以从开局重新走一遍，并在着法记录中回看每一步。</div><div class="review-grid"><div><div id="replayBoard" class="review-board"></div><div class="replay-controls"><button id="prevReplay">← 上一步</button><button id="nextReplay">下一步 →</button></div><p id="replayLabel" class="hint"></p></div><div><p class="review-step">关键节点</p>'+(replayIssues.length?replayIssues.map(x=>'<article class="issue '+(x.loss>150?'bad':'')+'"><strong>'+x.level+' · '+x.move+'</strong><span>推荐 <b>'+x.best+'</b>，局面评价下降约 '+Math.round(x.loss/10)+' 分。</span></article>').join(''):'<p>没有检测到明显的战略性失误。</p>')+routePrompt+'</div></div>';review.classList.add('show');drawReplay();document.querySelector('#prevReplay').onclick=()=>{replayAt=Math.max(0,replayAt-1);drawReplay()};document.querySelector('#nextReplay').onclick=()=>{replayAt=Math.min(log.length,replayAt+1);drawReplay()};document.querySelector('#showRoute')?.addEventListener('click',showBestRoute);review.scrollIntoView({behavior:'smooth',block:'start'})}
document.querySelector('#start').onclick=()=>{game=new Chess();human=document.querySelector('#side').value;chosen=null;log=[];busy=false;review.classList.remove('show');render();setStatus();if(human==='b')afterMove()};
/* 终局时再做较深入的复盘评估，避免每次用户落子阻塞动画。 */
makeReview=function(){const humanMoves=log.filter(x=>x.side===human);let issues=[];for(const x of humanMoves){const ideal=best(new Chess(x.before),2),after=new Chess(x.before);after.move(x);const loss=ideal.value-(-negamax(after,1));if(ideal.move&&x.san!==ideal.move.san&&(loss>45||issues.length<2))issues.push({level:loss>150?'严重失误':loss>70?'可改进的一步':'有更好的选择',loss,move:x.san,best:ideal.move.san,before:x.before})}replayIssues=issues.sort((a,b)=>b.loss-a.loss).slice(0,6);const c=new Chess();replayFens=[c.fen()];for(const x of log){c.move(x);replayFens.push(c.fen())}replayAt=0;const routePrompt=replayIssues.length>=2?'<div class="route"><b>你多次错过了当前局面的最佳着。</b><br><button id="showRoute">要不要展示最优路线？</button><div id="routeResult"></div></div>':'';content.innerHTML='<div class="summary">你走了 <b>'+humanMoves.length+'</b> 手。使用左右按钮可以从开局重新走一遍，并在着法记录中回看每一步。</div><div class="review-grid"><div><div id="replayBoard" class="review-board"></div><div class="replay-controls"><button id="prevReplay">← 上一步</button><button id="nextReplay">下一步 →</button></div><p id="replayLabel" class="hint"></p></div><div><p class="review-step">关键节点</p>'+(replayIssues.length?replayIssues.map(x=>'<article class="issue '+(x.loss>150?'bad':'')+'"><strong>'+x.level+' · '+x.move+'</strong><span>推荐 <b>'+x.best+'</b>，局面评价下降约 '+Math.round(x.loss/10)+' 分。</span></article>').join(''):'<p>没有检测到明显的战略性失误。</p>')+routePrompt+'</div></div>';review.classList.add('show');drawReplay();document.querySelector('#prevReplay').onclick=()=>{replayAt=Math.max(0,replayAt-1);drawReplay()};document.querySelector('#nextReplay').onclick=()=>{replayAt=Math.min(log.length,replayAt+1);drawReplay()};document.querySelector('#showRoute')?.addEventListener('click',showBestRoute);review.scrollIntoView({behavior:'smooth',block:'start'})};
</script></body></html>
